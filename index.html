less"},{"key":"D","text":"Non-irritating"}],"answer":["B"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1891","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"A patient with history of heart disease was found in a state of coma in his car in an underground garage with his car windows closed. Based on this information, what else can be found as one of the manifestations of intoxication to this material at this stage?","options":[{"key":"A","text":"Myocardial infarction"},{"key":"B","text":"Dizziness"},{"key":"C","text":"Headache"},{"key":"D","text":"Convulsions"}],"answer":["A"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1892","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"Fetuses are more vulnerable to CO toxicity because:","options":[{"key":"A","text":"Fetal Hb has more affinity to CO than adult Hb"},{"key":"B","text":"Fetal elimination of CO is slower than that of the mother"},{"key":"C","text":"There is a natural leftward shift of oxyhemoglobin dissociation curve"},{"key":"D","text":"All of the above Toxic gases^"}],"answer":["D"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1893","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"What causes coma in CO intoxication cases?","options":[{"key":"A","text":"Anemic anoxia"},{"key":"B","text":"Respiratory failure"},{"key":"C","text":"Intracranial pressure"},{"key":"D","text":"Sedative effect of CO"}],"answer":["A"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1894","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"Which of the following is the most effective measure to prevent accidental household carbon monoxide poisoning?","options":[{"key":"A","text":"Keeping windows closed during winter"},{"key":"B","text":"Using fuel-burning appliances away from fresh air sources"},{"key":"C","text":"Ensuring proper ventilation and installing CO detectors"},{"key":"D","text":"Burning charcoal indoors for heating"}],"answer":["C"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1895","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"In a recent fire accident, four firemen were sent to contain the situation. Three of them were able to perform the whole procedure without problems, yet one of them experienced throbbing headaches and nausea. Since they were all in the same situation, what personal factor might have led to that fireman experiencing symptoms of intoxication unlike his mates?","options":[{"key":"A","text":"Smoker"},{"key":"B","text":"Cardiovascular diseases"},{"key":"C","text":"Concentration of gas in the inspired air"},{"key":"D","text":"A 8c B Toxic gases^"}],"answer":["D"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1896","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"A housewife was preparing grilled food indoors without ventilation. Later she was transferred to the hospital after collapsing. What would be a characteristic that can be seen on her?","options":[{"key":"A","text":"Blueish coloration of the body"},{"key":"B","text":"Red coloration of the body"},{"key":"C","text":"Rash"},{"key":"D","text":"Severe hypothermia"}],"answer":["B"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1897","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"A 70-year-old man with a gas heater on and windows closed felt immense chest pain radiating to his arms. What would be the suitable screening in this case?","options":[{"key":"A","text":"ECG"},{"key":"B","text":"Cardiac biomarkers"},{"key":"C","text":"Carboxyhemoglobin levels"},{"key":"D","text":"All of the above"}],"answer":["D"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1898","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"Which of the following best explains the pathophysiology of carbon monoxide (CO) poisoning?","options":[{"key":"A","text":"Increased dissociation of 02 from hemoglobin"},{"key":"B","text":"Increased dissociation of 02 from myoglobin"},{"key":"C","text":"Formation of carboxyhemoglobin with leftward shift of the oxyhemoglobin dissociation curve"},{"key":"D","text":"Direct inhibition of cellular respiratory centers *9 ases &"}],"answer":["C"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1899","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"What is the effect of carbon monoxide on Nitric oxide?","options":[{"key":"A","text":"Causes its displacement from heme-containing proteins, resulting in hypertension"},{"key":"B","text":"Causes its displacement from heme-containing proteins, resulting in hypotension"},{"key":"C","text":"Inhibits its displacement from heme-containing proteins, resulting in hypotension"},{"key":"D","text":"Inhibits its displacement from heme-containing proteins, resulting in hypertension"}],"answer":["B"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1900","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"Patients with pre-existing cardiac disease show manifestations of carbon monoxide poisoning at:","options":[{"key":"A","text":"Higher levels of carboxyhemoglobin (COHb) than healthy individuals"},{"key":"B","text":"Lower levels of carboxyhemoglobin (COHb) than healthy individuals"},{"key":"C","text":"The same levels of carboxyhemoglobin (COHb) as healthy individuals"},{"key":"D","text":"Only when COHb exceeds 70% Toxic gases^"}],"answer":["B"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1901","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"Which of the following cutaneous findings is specifically associated with severe carbon monoxide poisoning?","options":[{"key":"A","text":"Petechial hemorrhages"},{"key":"B","text":"Cutaneous bullae"},{"key":"C","text":"Cyanosis"},{"key":"D","text":"Ecchymosis"}],"answer":["B"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1902","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"Which of the following ocular complications is most characteristic of carbon monoxide poisoning?","options":[{"key":"A","text":"Cataract formation"},{"key":"B","text":"Central retinal artery occlusion"},{"key":"C","text":"Glaucoma"},{"key":"D","text":"Retinal detachment"}],"answer":["B"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1903","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"A 35-year-old man survives acute carbon monoxide poisoning. He recovers initially but, three weeks later, develops gait disturbance, personality changes, and memory problems. WTiich of the following best explains his condition?","options":[{"key":"A","text":"Acute hypoxic brain injury"},{"key":"B","text":"Delayed neuropsychiatric syndrome due to CO poisoning"},{"key":"C","text":"Alcoholism withdrawal"},{"key":"D","text":"Post-concussion syndrome"}],"answer":["B"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1904","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"What is the expected arterial blood gas (ABG) finding later in the course of carbon monoxide poisoning?","options":[{"key":"A","text":"Respiratory alkalosis"},{"key":"B","text":"Respiratory acidosis"},{"key":"C","text":"Metabolic acidosis"},{"key":"D","text":"Metabolic alkalosis ases &"}],"answer":["C"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1905","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"A 28-year-old presents with headache, nausea, and fatigue after using a gas heater in winter. His symptoms resemble a viral flu syndrome. Which condition should be considered in the differential?","options":[{"key":"A","text":"Influenza"},{"key":"B","text":"Appendicitis"},{"key":"C","text":"Peptic ulcer disease"},{"key":"D","text":"Asthma"}],"answer":["A"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1906","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"A 38-year-old woman presents with coma after CO exposure. ABG shows metabolic acidosis, and chest imaging reveals diffuse bilateral infiltrates. Which of the following is the most likely alternative diagnosis to consider?","options":[{"key":"A","text":"Depression"},{"key":"B","text":"ARDS"},{"key":"C","text":"Migraine"},{"key":"D","text":"Viral flu syndrome"}],"answer":["B"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1907","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"What is the primary medical treatment for acute carbon monoxide poisoning?","options":[{"key":"A","text":"Breathing 100% oxygen via non-rebreather mask"},{"key":"B","text":"Intravenous antibiotics"},{"key":"C","text":"Corticosteroids"},{"key":"D","text":"Bronchodilators ases &"}],"answer":["A"],"type":"single","explanation":"Answer reproduced from the source answer key."},{"id":"q-1908","origin":"old","subject":"Toxicology","topic":"Toxic gases","question":"A pregnant woman presents with carbon monoxide poisoning and evidence of fetal distress. What is the treatment of choice?","options":[{"key":"A","text":"100% oxygen via non-rebreather mask"},{"key":"B","text":"Endotracheal intubation with 100% oxygen"},{"key":"C","text":"Hyperbaric oxygen therapy"},{"key":"D","text":"IV fluids and supportive care"}],"answer":["C"],"type":"single","explanation":"Answer reproduced from the source answer key."}];
const TOPICS={"Toxicology":["General toxicology","Blood gas analysis in toxicology","Corrosives","Heavy metals","Pesticides and rodenticides","Toxic gases","Alcohols","Anticonvulsants (Phenytoin & Carbamazepine)","Sedatives and hypnotics (Barbiturates & Benzodiazepines)","Psychotropics (TCA & Lithium)","Toxicity by analgesics (Salicylates & Paracetamol)","Toxicity by cardiovascular drugs","Plant poisons (Atropine group)","Animal poisoning","Food poisoning","Toxicology practical"],"Forensic Medicine":["Medicolegal aspects of death","Postmortem changes","Death certificate and cause of death","Identification","Wounds","Physical and thermal injuries","Head injuries","Eye and ear trauma","Firearm injuries","Transportation injuries","Asphyxia","Sexual offences","Pregnancy, delivery and abortion","Infanticide, child abuse and FGM","Forensic serology and DNA","Forensic practical"],"Community Medicine":["Maternal health","Basic nutrition","Quality of health and burden of disease","People with special needs","Child health","School health","Adolescent health","Mental health","Environmental health and hospital waste management","Health management 1 & 2","Quality","Geriatric health","Occupational health","Additional Topics"],"Family Medicine":["Introduction","General principles of family medicine","Interviewing techniques","Communication skills","Referral","Evidence based medicine","Doctor patient relationship","Access to care","Patient compliance"]};
const META={"Toxicology":{"slug":"toxicology","icon":"⚗","subtitle":"Poisons, antidotes and emergency management","accent":"#6d4aff","accent2":"#9a63ff"},"Forensic Medicine":{"slug":"forensic","icon":"⌁","subtitle":"Medicolegal practice and forensic sciences","accent":"#1e5f97","accent2":"#3a84c3"},"Community Medicine":{"slug":"community","icon":"✚","subtitle":"Population health, prevention and management","accent":"#158467","accent2":"#36a885"},"Family Medicine":{"slug":"family","icon":"⌂","subtitle":"Comprehensive, continuous patient care","accent":"#d66d2f","accent2":"#f4a261"}};
const SUBJECTS=["Toxicology","Forensic Medicine","Community Medicine","Family Medicine"];
const state={
 subject:null,topic:null,view:"subjects",search:"",
 saved:new Set(JSON.parse(localStorage.getItem("ftf-v4-saved")||"[]")),
 notes:JSON.parse(localStorage.getItem("ftf-v4-notes")||"{}"),
 answers:{}, multi:{}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const answerText=q=>Array.isArray(q.answer)?q.answer.join(", "):String(q.answer);
const toast=msg=>{const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1800)};
function saveLocal(){localStorage.setItem("ftf-v4-saved",JSON.stringify([...state.saved]));localStorage.setItem("ftf-v4-notes",JSON.stringify(state.notes))}
function showApp(){$("#introView").hidden=true;$("#appView").hidden=false;localStorage.setItem("ftf-v4-entered","1");showSubjects()}
function setNav(name){$("#subjectsBtn").classList.toggle("active",name==="subjects");$("#notesBtn").classList.toggle("active",name==="notes")}
function hideViews(){$("#subjectsView").hidden=true;$("#subjectView").hidden=true;$("#notesView").hidden=true}
function showSubjects(){state.view="subjects";hideViews();$("#subjectsView").hidden=false;setNav("subjects");history.replaceState(null,"","#subjects");scrollTo(0,0)}
function renderSubjects(){
 $("#subjectGrid").innerHTML=SUBJECTS.map(s=>{const m=META[s];return `<button class="subject-card" style="--card-accent:${m.accent};--card-accent2:${m.accent2}" data-subject="${esc(s)}"><div class="subject-icon">${m.icon}</div><h3>${esc(s)}</h3><p>${esc(m.subtitle)}</p><span class="subject-arrow">Open subject →</span></button>`}).join("");
 document.querySelectorAll(".subject-card").forEach(b=>b.onclick=()=>openSubject(b.dataset.subject));
}
function openSubject(subject,topic){
 state.subject=subject;state.topic=topic&&TOPICS[subject].includes(topic)?topic:TOPICS[subject][0];state.search="";state.view="subject";
 hideViews();$("#subjectView").hidden=false;setNav("");renderTopicNav();renderTopic();history.replaceState(null,"",`#subject=${encodeURIComponent(subject)}&topic=${encodeURIComponent(state.topic)}`);scrollTo(0,0)
}
function renderTopicNav(){
 const m=META[state.subject];
 $("#topicPanel").style.setProperty("--accent",m.accent);$("#topicPanel").style.setProperty("--accent2",m.accent2);
 $("#topicPanel").innerHTML=`<div class="subject-mini"><h2>${esc(state.subject)}</h2><p>${esc(m.subtitle)}</p></div>`+TOPICS[state.subject].map(t=>`<button class="topic-btn ${t===state.topic?"active":""}" data-topic="${esc(t)}">${esc(t)}</button>`).join("");
 document.querySelectorAll(".topic-btn").forEach(b=>b.onclick=()=>selectTopic(b.dataset.topic));
 $("#topicMobile").innerHTML=TOPICS[state.subject].map(t=>`<option value="${esc(t)}" ${t===state.topic?"selected":""}>${esc(t)}</option>`).join("");
}
function selectTopic(topic){state.topic=topic;state.search="";renderTopicNav();renderTopic();history.replaceState(null,"",`#subject=${encodeURIComponent(state.subject)}&topic=${encodeURIComponent(topic)}`);scrollTo(0,0)}
function filteredQuestions(){
 const all=QUESTIONS.filter(q=>q.subject===state.subject&&q.topic===state.topic);
 const s=state.search.trim().toLowerCase();if(!s)return all;
 const words=s.split(/\s+/).filter(Boolean);
 return all.filter(q=>{const hay=(q.question+" "+q.options.map(o=>o.text).join(" ")).toLowerCase();return words.every(w=>hay.includes(w))})
}
function renderTopic(){
 const m=META[state.subject];document.documentElement.style.setProperty("--accent",m.accent);document.documentElement.style.setProperty("--accent2",m.accent2);
 $("#contentHead").innerHTML=`<h2>${esc(state.topic)}</h2><p>${esc(state.subject)} — all questions in this topic are shown on one page.</p><div class="tools"><input class="search" id="topicSearch" placeholder="Search inside this topic…" value="${esc(state.search)}"><button class="secondary" id="resetTopic">Reset answers</button><button class="secondary" id="backSubjects">← Subjects</button></div>`;
 $("#topicSearch").oninput=e=>{state.search=e.target.value;renderQuestions()};
 $("#resetTopic").onclick=()=>{filteredQuestions().forEach(q=>{delete state.answers[q.id];delete state.multi[q.id]});renderQuestions();toast("Topic answers reset")};
 $("#backSubjects").onclick=showSubjects;renderQuestions();
}
function optionHtml(q,o){
 const result=state.answers[q.id], chosen=result?.selected||[];
 let cls="option";if(chosen.includes(o.key))cls+=" selected";
 if(result?.checked){if(q.answer.includes(o.key))cls+=" correct";else if(chosen.includes(o.key))cls+=" wrong"}
 return `<button class="${cls}" data-key="${esc(o.key)}" ${result?.checked?"disabled":""}><span class="option-key">${esc(o.key)}</span><span>${esc(o.text)}</span></button>`
}
function renderQuestions(){
 const qs=filteredQuestions();
 if(!qs.length){$("#questionList").innerHTML='<div class="empty">No matching questions in this topic.</div>';return}
 $("#questionList").innerHTML=qs.map((q,i)=>{
  const result=state.answers[q.id];const correct=result?.correct;
  const cardClass=result?.checked?(correct?" answered-correct":" answered-wrong"):"";
  const ans=answerText(q);
  const answerOnly=q.origin==="new";
  let interaction="";
  if(q.type==="written"){
   interaction=`<div class="check-row"><button class="show-answer" data-action="show">Show Answer</button></div>`;
  }else{
   interaction=`<div class="options">${q.options.map(o=>optionHtml(q,o)).join("")}</div>`;
   if(q.type==="multi")interaction+=`<div class="check-row"><button class="check-btn" data-action="check">Check Answer</button>${result?.checked?`<span class="feedback ${correct?"ok":"no"}">${correct?"Correct ✓":"Incorrect ✕"}</span>`:""}</div>`;
   else if(result?.checked)interaction+=`<div class="check-row"><span class="feedback ${correct?"ok":"no"}">${correct?"Correct ✓":"Incorrect ✕"}</span><button class="secondary" data-action="retry">Try again</button></div>`;
  }
  const show=result?.show||result?.checked;
  const explanation=(!answerOnly&&q.explanation)?`<div class="explanation">${esc(q.explanation)}</div>`:"";
  return `<article class="question-card ${cardClass}" data-id="${q.id}">
   <div class="q-top"><span class="q-number">${i+1}</span><h3 class="q-title">${esc(q.question)}</h3><div class="q-actions"><button class="mini-btn" data-action="save" title="Send to Notes">${state.saved.has(q.id)?"★":"☆"}</button></div></div>
   ${interaction}
   <div class="answer-box ${show?"show":""}"><div class="answer-line">Answer: ${esc(ans)}</div>${explanation}<div class="answer-tools"><button class="note-btn" data-action="save">${state.saved.has(q.id)?"Remove from Notes":"Send to Notes"}</button></div></div>
  </article>`
 }).join("");
 bindQuestions(qs);
}
function sameSet(a,b){return a.length===b.length&&[...a].sort().every((x,i)=>x===[...b].sort()[i])}
function bindQuestions(qs){
 document.querySelectorAll(".question-card").forEach(card=>{
  const q=qs.find(x=>x.id===card.dataset.id);if(!q)return;
  card.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>{
    if(q.type==="multi"){
      const arr=state.multi[q.id]||[];const k=btn.dataset.key;state.multi[q.id]=arr.includes(k)?arr.filter(x=>x!==k):[...arr,k];
      state.answers[q.id]={selected:state.multi[q.id],checked:false,show:false};renderQuestions()
    }else{
      const selected=[btn.dataset.key];state.answers[q.id]={selected,checked:true,correct:sameSet(selected,q.answer),show:true};renderQuestions()
    }
  });
  card.querySelectorAll('[data-action="check"]').forEach(b=>b.onclick=()=>{const selected=state.multi[q.id]||[];if(!selected.length)return toast("Choose at least one option");state.answers[q.id]={selected,checked:true,correct:sameSet(selected,q.answer),show:true};renderQuestions()});
  card.querySelectorAll('[data-action="show"]').forEach(b=>b.onclick=()=>{state.answers[q.id]={selected:[],checked:false,correct:null,show:true};renderQuestions()});
  card.querySelectorAll('[data-action="retry"]').forEach(b=>b.onclick=()=>{delete state.answers[q.id];delete state.multi[q.id];renderQuestions()});
  card.querySelectorAll('[data-action="save"]').forEach(b=>b.onclick=()=>toggleSave(q));
 });
}
function toggleSave(q){state.saved.has(q.id)?state.saved.delete(q.id):state.saved.add(q.id);saveLocal();if(state.view==="notes")renderNotes();else renderQuestions();toast(state.saved.has(q.id)?"Saved to Notes":"Removed from Notes")}
function showNotes(){state.view="notes";hideViews();$("#notesView").hidden=false;setNav("notes");renderNotes();history.replaceState(null,"","#notes");scrollTo(0,0)}
function renderNotes(){
 const qs=[...state.saved].map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
 if(!qs.length){$("#notesList").innerHTML='<div class="empty">No saved questions yet. Use “Send to Notes” under any answer.</div>';return}
 $("#notesList").innerHTML=qs.map(q=>`<article class="note-card"><h3>${esc(q.question)}</h3><div class="answer-line">Answer: ${esc(answerText(q))}</div>${q.origin!=="new"&&q.explanation?`<div class="explanation">${esc(q.explanation)}</div>`:""}<textarea data-note="${q.id}" placeholder="Write your personal note…">${esc(state.notes[q.id]||"")}</textarea><div class="answer-tools"><button class="secondary" data-remove="${q.id}">Remove</button></div></article>`).join("");
 document.querySelectorAll("[data-note]").forEach(t=>t.oninput=()=>{state.notes[t.dataset.note]=t.value;saveLocal()});
 document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{state.saved.delete(b.dataset.remove);saveLocal();renderNotes()});
}
$("#enterBtn").onclick=showApp;$("#subjectsBtn").onclick=showSubjects;$("#notesBtn").onclick=showNotes;$("#topicMobile").onchange=e=>selectTopic(e.target.value);
$("#themeBtn").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("ftf-v4-theme",document.body.classList.contains("dark")?"dark":"light")};
$("#clearNotes").onclick=()=>{if(confirm("Remove all saved notes?")){state.saved.clear();state.notes={};saveLocal();renderNotes()}};
if(localStorage.getItem("ftf-v4-theme")==="dark")document.body.classList.add("dark");
renderSubjects();
function applyHash(){
 const h=location.hash;
 if(h==="#notes")return showNotes();
 if(h.startsWith("#subject=")){const p=new URLSearchParams(h.slice(1));const s=p.get("subject"),t=p.get("topic");if(SUBJECTS.includes(s))return openSubject(s,t)}
 showSubjects()
}
window.addEventListener("popstate",applyHash);
if(localStorage.getItem("ftf-v4-entered")==="1"){$("#introView").hidden=true;$("#appView").hidden=false;applyHash()}

// Smooth Adhkar reminder every minute.
(()=>{
 const items=["سبحان الله وبحمده، سبحان الله العظيم.","لا حول ولا قوة إلا بالله.","أستغفر الله العظيم وأتوب إليه.","اللهم صلِّ وسلم على نبينا محمد.","سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر.","حسبي الله لا إله إلا هو، عليه توكلت وهو رب العرش العظيم.","رَبِّ زِدْنِي عِلْمًا."];
 const box=$("#adhkar"),text=$("#adhkarText");let last=-1,timer;
 const hide=()=>box.classList.remove("show");
 const show=()=>{let n;do{n=Math.floor(Math.random()*items.length)}while(n===last&&items.length>1);last=n;text.textContent=items[n];box.classList.add("show");clearTimeout(timer);timer=setTimeout(hide,13000)};
 $("#adhkarClose").onclick=hide;setTimeout(()=>{show();setInterval(show,60000)},18000)
})();
</script>
