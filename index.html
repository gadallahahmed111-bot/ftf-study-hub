<style>
:root{
 --bg:#f4f6fb;--surface:#fff;--surface2:#f8f9fd;--text:#182239;--muted:#68748a;--line:#e0e5ef;
 --primary:#6246ea;--success:#158467;--danger:#c83f52;--warning:#a86400;--shadow:0 18px 55px rgba(27,38,70,.10);
 --radius:20px
}
body.dark{--bg:#0b1120;--surface:#121b2d;--surface2:#18243a;--text:#edf3ff;--muted:#a9b7ce;--line:#2b3952;--shadow:0 20px 60px rgba(0,0,0,.30)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
[hidden]{display:none!important}
.intro{min-height:100vh;display:grid;place-items:center;padding:24px;background:
 radial-gradient(circle at 15% 12%,rgba(108,74,255,.18),transparent 34%),
 radial-gradient(circle at 85% 88%,rgba(21,132,103,.14),transparent 32%),var(--bg)}
.intro-card{width:min(850px,100%);background:color-mix(in srgb,var(--surface) 95%,transparent);border:1px solid var(--line);border-radius:32px;padding:clamp(28px,6vw,65px);text-align:center;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.intro-logo{width:82px;height:82px;border-radius:25px;margin:auto;display:grid;place-items:center;color:#fff;font-size:27px;font-weight:950;background:linear-gradient(135deg,#6246ea,#9b63ff);box-shadow:0 18px 35px rgba(98,70,234,.28)}
.intro h1{font-size:clamp(34px,6vw,58px);margin:20px 0 5px;letter-spacing:-.04em}.intro-sub{color:var(--muted);margin:0 0 28px;font-size:17px}
.prayer{direction:rtl;background:linear-gradient(135deg,color-mix(in srgb,#158467 11%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,#158467 32%,var(--line));border-radius:20px;padding:20px;margin:25px auto;max-width:680px}
.prayer small{display:block;color:#158467;font-weight:900;margin-bottom:7px}.prayer p{margin:0;font:800 21px/2 Tahoma,Arial,sans-serif}
.cta{border:0;border-radius:15px;padding:14px 25px;color:#fff;background:linear-gradient(135deg,#6246ea,#8f5cff);font-weight:900;box-shadow:0 13px 25px rgba(98,70,234,.25)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 22px;background:color-mix(in srgb,var(--surface) 90%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:950}.brand-logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6246ea,#9b63ff)}.top-spacer{flex:1}
.icon-btn,.nav-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:9px 12px;font-weight:800}.nav-btn.active{color:#6246ea;border-color:color-mix(in srgb,#6246ea 35%,var(--line));background:color-mix(in srgb,#6246ea 8%,var(--surface))}
.page{max-width:1440px;margin:auto;padding:28px}
.subjects-head{text-align:center;margin:18px auto 30px}.subjects-head h2{font-size:clamp(28px,5vw,42px);margin:0}.subjects-head p{color:var(--muted)}
.subject-grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:18px;max-width:1000px;margin:auto}
.subject-card{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--surface);border-radius:25px;padding:27px;text-align:left;color:var(--text);box-shadow:0 8px 27px rgba(27,38,70,.06);transition:.25s}
.subject-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.subject-card:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-75px;top:-85px;background:var(--card-accent);opacity:.12}
.subject-icon{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;color:#fff;font-size:25px;background:linear-gradient(135deg,var(--card-accent),var(--card-accent2));margin-bottom:20px}
.subject-card h3{font-size:23px;margin:0 0 8px}.subject-card p{margin:0;color:var(--muted)}.subject-arrow{display:inline-block;margin-top:20px;color:var(--card-accent);font-weight:900}
.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.topic-panel{position:sticky;top:78px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;max-height:calc(100vh - 100px);overflow:auto}
.subject-mini{padding:15px;border-radius:17px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:13px}.subject-mini h2{font-size:19px;margin:0 0 4px}.subject-mini p{font-size:12px;margin:0;opacity:.88}
.topic-btn{display:block;width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 11px;border-radius:11px;margin:2px 0;font-weight:700}.topic-btn:hover,.topic-btn.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface2))}
.topic-mobile{display:none;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px;padding:11px;margin-bottom:12px}
.content-head{border:1px solid var(--line);background:var(--surface);border-radius:23px;padding:22px 23px;margin-bottom:15px;box-shadow:0 7px 25px rgba(27,38,70,.05)}.content-head h2{font-size:clamp(23px,4vw,34px);margin:0 0 5px}.content-head p{margin:0;color:var(--muted)}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.search{flex:1;min-width:220px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;padding:10px 13px;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.secondary{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:800}
.question-card{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:19px;margin-bottom:13px;box-shadow:0 5px 19px rgba(27,38,70,.04)}.question-card.answered-correct{border-color:color-mix(in srgb,var(--success) 45%,var(--line))}.question-card.answered-wrong{border-color:color-mix(in srgb,var(--danger) 42%,var(--line))}
.q-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.q-number{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:10px;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface2));font-weight:950}.q-title{flex:1;margin:5px 0 0;font-size:16px;font-weight:850}.q-actions{display:flex;gap:6px}.mini-btn{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:10px;padding:7px 9px}
.options{display:grid;gap:9px;margin-top:16px}.option{width:100%;display:flex;gap:11px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:13px;padding:11px 12px;transition:.18s}.option:hover{border-color:var(--accent);transform:translateY(-1px)}.option-key{flex:0 0 31px;height:31px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-weight:950}
.option.selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}.option.correct{border-color:var(--success);background:color-mix(in srgb,var(--success) 10%,var(--surface))}.option.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,var(--surface))}.option:disabled{cursor:default;opacity:1;transform:none}
.check-row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}.check-btn,.show-answer{border:0;background:var(--accent);color:#fff;border-radius:11px;padding:9px 13px;font-weight:900}.feedback{font-weight:900}.feedback.ok{color:var(--success)}.feedback.no{color:var(--danger)}
.answer-box{display:none;margin-top:13px;border:1px solid color-mix(in srgb,var(--success) 35%,var(--line));background:color-mix(in srgb,var(--success) 8%,var(--surface));border-radius:13px;padding:13px}.answer-box.show{display:block}.answer-line{font-weight:950;color:var(--success)}.explanation{margin-top:8px;color:var(--muted)}.answer-tools{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}.note-btn{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 7%,var(--surface));color:var(--accent);border-radius:10px;padding:8px 11px;font-weight:850}
.empty{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:45px;color:var(--muted)}
.notes-list{max-width:1000px;margin:auto}.note-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:12px}.note-card h3{margin:0 0 10px;font-size:16px}.note-card textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--surface2);color:var(--text);margin-top:10px}
.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:var(--text);color:var(--surface);padding:11px 15px;border-radius:12px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
.adhkar{position:fixed;right:20px;top:50%;z-index:90;width:min(355px,calc(100vw - 32px));direction:rtl;text-align:right;background:color-mix(in srgb,var(--surface) 96%,transparent);border:1px solid color-mix(in srgb,var(--success) 35%,var(--line));border-radius:20px;box-shadow:var(--shadow);padding:17px 18px;opacity:0;visibility:hidden;transform:translate(120%,-50%) scale(.94);transition:transform .8s cubic-bezier(.16,1,.3,1),opacity .45s,visibility .45s}.adhkar.show{opacity:1;visibility:visible;transform:translate(0,-50%) scale(1)}.adhkar-head{display:flex;justify-content:space-between;align-items:center;color:var(--success);font-weight:950}.adhkar-close{border:0;background:transparent;color:var(--muted);font-size:20px}.adhkar p{font:800 17px/1.9 Tahoma,Arial,sans-serif;margin:9px 0 0}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.topic-panel{display:none}.topic-mobile{display:block}.subject-grid{grid-template-columns:1fr}.page{padding:16px}}
@media(max-width:620px){.brand span{display:none}.topbar{padding:10px}.nav-btn{padding:8px 9px}.q-top{flex-wrap:wrap}.q-actions{margin-left:auto}.intro-card{padding:27px 18px}.prayer p{font-size:18px}.adhkar{left:16px;right:16px;top:auto;bottom:18px;width:auto;transform:translateY(140%)}.adhkar.show{transform:translateY(0)}}
@media print{.topbar,.topic-panel,.topic-mobile,.tools,.q-actions,.check-row,.answer-tools,.adhkar{display:none!important}.workspace{display:block}.page{padding:0}.question-card{break-inside:avoid;box-shadow:none}.answer-box{display:block}}
</style>
</head>

<script>
const QUESTIONS=[{"id":"q-1","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Which of the following patient-related factors affects the action of a poison?","options":[{"key":"A","text":"Gender"},{"key":"B","text":"Route of administration"},{"key":"C","text":"Age"},{"key":"D","text":"Marital status"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-2","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"The form of poison that is most rapidly/completely absorbed is:","options":[{"key":"A","text":"Gas"},{"key":"B","text":"Liquid"},{"key":"C","text":"Solid"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-3","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"The first step in emergency management of an intoxicated patient is to:","options":[{"key":"A","text":"Assess the blood pressure"},{"key":"B","text":"Assess the respiration"},{"key":"C","text":"Give an antidote"},{"key":"D","text":"Take a history"},{"key":"E","text":"Decontaminate the GIT"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-4","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"All of the following affect toxicity EXCEPT:","options":[{"key":"A","text":"Amount"},{"key":"B","text":"Colour"},{"key":"C","text":"Form of poison"},{"key":"D","text":"Metabolism"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-5","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"For alkaline diuresis to be effective, the drug should be:","options":[{"key":"A","text":"Lipophilic"},{"key":"B","text":"Of high volume of distribution"},{"key":"C","text":"Highly protein bound"},{"key":"D","text":"A weak acid"},{"key":"E","text":"Metabolised by first-pass effect"}],"answer":["D"],"type":"single","explanation":""},{"id":"q-6","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Whole bowel irrigation is indicated in:","options":[{"key":"A","text":"Body packers of illicit drugs"},{"key":"B","text":"Drugs poorly adsorbed by charcoal"},{"key":"C","text":"Slow-release preparations"},{"key":"D","text":"Body stuffers"},{"key":"E","text":"All of the above"}],"answer":["E"],"type":"single","explanation":""},{"id":"q-7","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Gastric lavage is contraindicated in:","options":[{"key":"A","text":"Severe CNS depression"},{"key":"B","text":"Severe CNS stimulation"},{"key":"C","text":"Cardiac dysrhythmia"},{"key":"D","text":"All of the above"}],"answer":["D"],"type":"single","explanation":""},{"id":"q-8","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Many overdoses respond to multiple-dose activated charcoal (MDAC). The mechanism is:","options":[{"key":"A","text":"The drug has enterohepatic or enterogastric recirculation"},{"key":"B","text":"Certain drugs respond as if there is “gastric dialysis”"},{"key":"C","text":"MDAC should never be given because it always causes obstruction"},{"key":"D","text":"A and B"}],"answer":["D"],"type":"single","explanation":""},{"id":"q-9","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Which statement about peritoneal dialysis is correct?","options":[{"key":"A","text":"It is more effective than hemodialysis"},{"key":"B","text":"It rarely causes water and electrolyte imbalance"},{"key":"C","text":"The dialysing membrane is polyethylene glycol"},{"key":"D","text":"Intestinal perforation and peritonitis are its common complications"}],"answer":["D"],"type":"single","explanation":""},{"id":"q-10","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"The following statement is NOT true regarding alkaline diuresis:","options":[{"key":"A","text":"It is done in poisoning with weak acidic drugs"},{"key":"B","text":"It is done by giving sodium bicarbonate I.V."},{"key":"C","text":"Hyperkalemia is a serious risk"},{"key":"D","text":"Blood pH and electrolytes should be monitored"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-11","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Coma cocktail includes:","options":[{"key":"A","text":"Dextrose — naloxone — thiamine"},{"key":"B","text":"Dextrose — naloxone — adrenaline"},{"key":"C","text":"Mannitol — glucose — thiamine"},{"key":"D","text":"Syrup of ipecac — glucose — naloxone"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-12","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"The best method to avoid aspiration of fluids during gastric lavage in a comatose patient is:","options":[{"key":"A","text":"Head lower than feet"},{"key":"B","text":"Left lateral position"},{"key":"C","text":"Introduction of a cuffed endotracheal tube before lavage"},{"key":"D","text":"Continuous suction from the trachea"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-13","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Toxins flow from blood by concentration gradient in:","options":[{"key":"A","text":"Hemodialysis"},{"key":"B","text":"Alkalinisation of urine"},{"key":"C","text":"Fluid diuresis"},{"key":"D","text":"Whole bowel irrigation"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-14","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"A comatose patient with GCS 4 has been stabilised with ABC. The next step is:","options":[{"key":"A","text":"Identification of poison"},{"key":"B","text":"Immediate CT brain"},{"key":"C","text":"Administer naloxone, thiamine and dextrose"},{"key":"D","text":"Give activated charcoal"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-15","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Which substance is used to alkalinise urine in toxic overdose?","options":[{"key":"A","text":"Strong acid"},{"key":"B","text":"Weak acid"},{"key":"C","text":"Strong alkali"},{"key":"D","text":"Weak alkali"}],"answer":["D"],"type":"single","explanation":""},{"id":"q-16","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Activated charcoal is NOT effective in poisoning by:","options":[{"key":"A","text":"Hydrocarbons"},{"key":"B","text":"Lithium"},{"key":"C","text":"Corrosives"},{"key":"D","text":"All of the above"}],"answer":["D"],"type":"single","explanation":""},{"id":"q-17","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Which method enhances toxin excretion by adsorption?","options":[{"key":"A","text":"Alkalinisation of urine"},{"key":"B","text":"Hemodialysis"},{"key":"C","text":"Multiple doses of activated charcoal"},{"key":"D","text":"Forced diuresis"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-18","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Regarding activated charcoal, the following is correct:","options":[{"key":"A","text":"It has a small surface area"},{"key":"B","text":"It is absorbed systemically"},{"key":"C","text":"It is given after gastric lavage"},{"key":"D","text":"Repeated doses do not enhance elimination"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-19","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"How does activated charcoal remove toxins?","options":[{"key":"A","text":"By absorption into the bloodstream"},{"key":"B","text":"By adsorption of toxins in the gastrointestinal tract"},{"key":"C","text":"By increasing renal clearance"},{"key":"D","text":"By neutralising acids"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-20","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"The following is NOT a characteristic of compounds cleared by hemodialysis:","options":[{"key":"A","text":"Water soluble"},{"key":"B","text":"High protein binding"},{"key":"C","text":"Molecular weight <500 Daltons"},{"key":"D","text":"Low volume of distribution"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-21","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Which method of enhancing excretion increases glomerular filtration rate?","options":[{"key":"A","text":"Forced diuresis"},{"key":"B","text":"Hemodialysis"},{"key":"C","text":"Urine alkalinisation"},{"key":"D","text":"Peritoneal dialysis"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-22","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Which method is NOT suitable for a patient with renal failure?","options":[{"key":"A","text":"Forced diuresis"},{"key":"B","text":"Hemodialysis"},{"key":"C","text":"Hemoperfusion"},{"key":"D","text":"Peritoneal dialysis"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-23","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Deferoxamine is used in the treatment of poisoning with:","options":[{"key":"A","text":"Arsenic"},{"key":"B","text":"Iron"},{"key":"C","text":"Lead"},{"key":"D","text":"Mercury"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-24","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"A cuffed endotracheal tube is used in:","options":[{"key":"A","text":"Child 6 years"},{"key":"B","text":"Old age 40 years"},{"key":"C","text":"Child with repeated vomiting"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-25","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Multiple-dose activated charcoal enhances elimination of poison present in:","options":[{"key":"A","text":"Kidney"},{"key":"B","text":"Blood"},{"key":"C","text":"Liver"},{"key":"D","text":"Lung"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-26","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"Alkalinisation of urine is mainly used to increase excretion of:","options":[{"key":"A","text":"Weak acids"},{"key":"B","text":"Weak bases"},{"key":"C","text":"Strong acids"},{"key":"D","text":"Strong bases"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-27","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"In unknown poisoning, the first step in management is:","options":[{"key":"A","text":"Gastric lavage"},{"key":"B","text":"Antidote administration"},{"key":"C","text":"ABC support"},{"key":"D","text":"Activated charcoal"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-28","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"(SAQ) Describe the concept of “toxidromes” and give three examples.","options":[],"answer":"A toxidrome is a recognisable cluster of vital signs and physical findings produced by one class of toxin. Examples: anticholinergic (atropine — hot, dry, red, dilated pupils, tachycardia); cholinergic (organophosphates — DUMBELS, miosis); opioid (miosis, coma, respiratory depression).","type":"written","explanation":""},{"id":"q-29","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"(SAQ) What are the three types of action by which poisons are classified?","options":[],"answer":"Local action, remote (systemic) action, and double/combined action.","type":"written","explanation":""},{"id":"q-30","origin":"new","subject":"Toxicology","topic":"General toxicology","question":"(SAQ) Which drug characteristics make hemodialysis an effective method of removal?","options":[],"answer":"Low molecular weight, water soluble, low volume of distribution and low protein binding.","type":"written","explanation":""},{"id":"q-31","origin":"new","subject":"Toxicology","topic":"Blood gas analysis in toxicology","question":"A patient with salicylate overdose has an ABG showing normal pH, normal PaCO2 and HCO− 3 = 21. What is the next step?","options":[{"key":"A","text":"Repeat ABG after 30 minutes"},{"key":"B","text":"Acidify urine"},{"key":"C","text":"Start immediate hemodialysis"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-32","origin":"new","subject":"Toxicology","topic":"Blood gas analysis in toxicology","question":"Expected ABG findings in hysterical hyperventilation:","options":[{"key":"A","text":"↓pH ↑PaCO2"},{"key":"B","text":"↑pH ↓PaCO2"},{"key":"C","text":"↓pH ↓PaCO2"},{"key":"D","text":"↑pH ↑HCO− 3"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-33","origin":"new","subject":"Toxicology","topic":"Blood gas analysis in toxicology","question":"Acute toxicity is most often associated with which acid–base disturbance?","options":[{"key":"A","text":"Metabolic acidosis"},{"key":"B","text":"Respiratory acidosis"},{"key":"C","text":"Metabolic alkalosis"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-34","origin":"new","subject":"Toxicology","topic":"Blood gas analysis in toxicology","question":"Drugs causing high anion gap metabolic acidosis include all EXCEPT:","options":[{"key":"A","text":"Carbonic anhydrase inhibitor"},{"key":"B","text":"Salicylate"},{"key":"C","text":"Methanol"},{"key":"D","text":"Ethylene glycol"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-35","origin":"new","subject":"Toxicology","topic":"Blood gas analysis in toxicology","question":"A woman is rushed to the ED after drinking a container of aspirin. Pulse and BP are normal, respiratory rate 23; ABG is normal except PaCO2 below normal. What next?","options":[{"key":"A","text":"Repeat ABG after 30 min"},{"key":"B","text":"Acidify urine"},{"key":"C","text":"Start immediate hemodialysis"},{"key":"D","text":"Activated charcoal should be given"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-36","origin":"new","subject":"Toxicology","topic":"Blood gas analysis in toxicology","question":"Inhalation of carbon monoxide or cyanide produces which acid–base picture?","options":[],"answer":"Metabolic acidosis (lactic acidosis from tissue hypoxia / blocked cytochrome oxidase).","type":"written","explanation":""},{"id":"q-37","origin":"new","subject":"Toxicology","topic":"Corrosives","question":"Which statement is TRUE regarding toxicity by strong inorganic acids?","options":[{"key":"A","text":"The higher the pH the more the toxicity"},{"key":"B","text":"Strong acids easily receive protons"},{"key":"C","text":"They cause denaturation of the proteins in the exposed tissues"},{"key":"D","text":"They cause saponification of the exposed tissues"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-38","origin":"new","subject":"Toxicology","topic":"Corrosives","question":"Which compound is considered a strong organic acid?","options":[{"key":"A","text":"Ammonia"},{"key":"B","text":"Bleach"},{"key":"C","text":"Phenol"},{"key":"D","text":"Potash"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-39","origin":"new","subject":"Toxicology","topic":"Corrosives","question":"Which statement is TRUE for bleach toxicity?","options":[{"key":"A","text":"It reacts with other acids to produce chloramine gas"},{"key":"B","text":"It reacts with ammonia to produce chlorine gas"},{"key":"C","text":"It causes tissue injury through coagulation necrosis"},{"key":"D","text":"It causes tissue injury through liquefaction necrosis"}],"answer":["D"],"type":"single","explanation":""},{"id":"q-40","origin":"new","subject":"Toxicology","topic":"Corrosives","question":"Which of the following is true?","options":[{"key":"A","text":"Inorganic acids cause both local and remote action, organic acids only local"},{"key":"B","text":"Both cause only local damage"},{"key":"C","text":"Organic acids cause local and remote action, while inorganic acids only cause local damage"},{"key":"D","text":"Neither causes remote action"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-41","origin":"new","subject":"Toxicology","topic":"Corrosives","question":"Which corrosive substance can cause tetany?","options":[{"key":"A","text":"Hydrochloric acid"},{"key":"B","text":"Carbolic acid"},{"k en?","options":[{"key":"A","text":"EDTA"},{"key":"B","text":"DMSA (succimer)"},{"key":"C","text":"BAL"},{"key":"D","text":"Penicillamine"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-48","origin":"new","subject":"Toxicology","topic":"Heavy metals","question":"In iron toxicity, bloody vomiting and diarrhoea are seen in which stage?","options":[{"key":"A","text":"Stage I"},{"key":"B","text":"Stage 2"},{"key":"C","text":"Stage 3"},{"key":"D","text":"Stage 4"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-49","origin":"new","subject":"Toxicology","topic":"Heavy metals","question":"Mercury is primarily re-excreted by which part of the body?","options":[{"key":"A","text":"Kidneys"},{"key":"B","text":"Liver"},{"key":"C","text":"Lungs"},{"key":"D","text":"Caecum"}],"answer":["D"],"type":"single","explanation":""},{"id":"q-50","origin":"new","subject":"Toxicology","topic":"Heavy metals","question":"Late death in iron intoxication is caused by:","options":[{"key":"A","text":"Liver failure"},{"key":"B","text":"Kidney failure"},{"key":"C","text":"Cardiac arrhythmia"},{"key":"D","text":"Hypovolaemic shock"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-51","origin":"new","subject":"Toxicology","topic":"Heavy metals","question":"Calcium homeostasis in the body affects the toxic level of which heavy metal?","options":[{"key":"A","text":"Lead"},{"key":"B","text":"Mercury"},{"key":"C","text":"Arsenic"},{"key":"D","text":"Iron"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-52","origin":"new","subject":"Toxicology","topic":"Heavy metals","question":"All of the following are common characteristics of heavy metal toxicity EXCEPT:","options":[{"key":"A","text":"Great affinity to keratin tissues"},{"key":"B","text":"Causes peripheral neuritis"},{"key":"C","text":"Resistant to putrefaction in post-mortem examination"},{"key":"D","text":"Affect only parenchymatous organs such as the heart, liver and kidneys"}],"answer":["D"],"type":"sin text":"Enhancing metal absorption in the intestine"},{"key":"D","text":"Converting non-toxic metals into toxic metabolites"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-58","origin":"new","subject":"Toxicology","topic":"Heavy metals","question":"Which toxic compound is highly associated with seafood consumption?","options":[{"key":"A","text":"Methyl mercury"},{"key":"B","text":"Ethyl mercury"},{"key":"C","text":"Lead acetate"},{"key":"D","text":"Tetra-ethyl lead"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-59","origin":"new","subject":"Toxicology","topic":"Heavy metals","question":"(SAQ) Describe mercurial erethism.","options":[],"answer":"A neuropsychiatric syndrome of chronic mercury poisoning: shyness, loss of confidence, anxiety, inability to work under supervision, poor concentration and memory problems.","type":"written","explanation":""},{"id":"q-60","origin":"new","subject":"Toxicology","topic":"Pesticides and rodenticides","question":"What is common between organophosphates and carbamates?","options":[{"key":"A","text":"Oxime is an effective antidote against both"},{"key":"B","text":"Cholinesterase can be measured from blood in both"},{"key":"C","text":"Atropine is an effective antidote against both"},{"key":"D","text":"Both have irreversible action"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-61","origin":"new","subject":"Toxicology","topic":"Pesticides and rodenticides","question":"Which drug can help prevent the intermediate stage of organophosphorus toxicity?","options":[{"key":"A","text":"Atropine"},{"key":"B","text":"Pralidoxime (2-PAM)"},{"key":"C","text":"Neostigmine"},{"key":"D","text":"Physostigmine"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-62","origin":"new","subject":"Toxicology","topic":"Pesticides and rodenticides","question":"Which symptom is caused by the nicotinic effects of organophosphates?","options":[{"key":"A","text":"Constriction of the pupils"},{"key":"B","text":"Bronchospasm"},{"key":"C","text":"Paralysis of the respiratory muscles"},{"key":"D","text":"Ataxia"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-63","origin":"new","subject":"Toxicology","topic":"Pesticides and rodenticides","question":"Name a commonly used rodenticide.","options":[],"answer":"Zinc phosphide.","type":"written","explanation":""},{"id":"q-64","origin":"new","subject":"Toxicology","topic":"Pesticides and rodenticides","question":"Blood cholinesterase activity of 40% of normal indicates:","options":[],"answer":"No symptoms — symptoms usually appear below about 20–30% of normal activity.","type":"written","explanation":""},{"id":"q-65","origin":"new","subject":"Toxicology","topic":"Pesticides and rodenticides","question":"(SAQ) What is the intermediate syndrome in organophosphate poisoning?","options":[],"answer":"Proximal muscle, neck flexor and respiratory muscle weakness appearing 24–96 hours after the acute cholinergic crisis, once the patient has apparently improved.","type":"written","explanation":""},{"id":"q-66","origin":"new","subject":"Toxicology","topic":"Toxic gases","question":"Which of the following shifts the oxyhaemoglobin dissociation curve to the left?","options":[{"key":"A","text":"Anaemia"},{"key":"B","text":"Carboxyhaemoglobin"},{"key":"C","text":"Increased temperature"},{"key":"D","text":"Acidosis"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-67","origin":"new","subject":"Toxicology","topic":"Toxic gases","question":"Hydrocyanic acid (cyanide) has a strong affinity for binding to which form of iron?","options":[{"key":"A","text":"Ferrous (Fe2+)"},{"key":"B","text":"Ferric (Fe3+)"},{"key":"C","text":"Elemental iron"},{"key":"D","text":"None of the above"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-68","origin":"new","subject":"Toxicology","topic":"Toxic gases","question":"A pregnant woman is rushed to the ER with carbon monoxide poisoning. What is the best treatment option?","options":[{"key": :"new","subject":"Toxicology","topic":"Alcohols","question":"One of the following statements is correct regarding ethanol:","options":[{"key":"A","text":"80% is absorbed from stomach and large intestine"},{"key":"B","text":"It is distributed to all tissues according to the water content"},{"key":"C","text":"It is metabolised mainly in the liver by reduction and conjugation"},{"key":"D","text":"It leads to hyperthermia"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-75","origin":"new","subject":"Toxicology","topic":"Alcohols","question":"Methanol is more toxic than ethanol due to:","options":[{"key":"A","text":"Formation of acetic acid"},{"key":"B","text":"Formation of acetaldehyde"},{"key":"C","text":"Severe metabolic acidosis"},{"key":"D","text":"Formation of carbon monoxide"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-76","origin":"new","subject":"Toxicology","topic":"Anticonvulsants (Phenytoin & Carbamazepine)","question":"Acute toxicity of phenytoin primarily causes:","options":[{"key":"A","text":"Hepatic failure"},{"key":"B","text":"Renal toxicity"},{"key":"C","text":"Cardiotoxicity"},{"key":"D","text":"Hyperkalemia"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-77","origin":"new","subject":"Toxicology","topic":"Anticonvulsants (Phenytoin & Carbamazepine)","question":"What is the most common cause of death in carbamazepine toxicity?","options":[{"key":"A","text":"Cardiac arrest"},{"key":"B","text":"Respiratory failure"},{"key":"C","text":"Hepatic failure"},{"key":"D","text":"Renal failure"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-78","origin":"new","subject":"Toxicology","topic":"Anticonvulsants (Phenytoin & Carbamazepine)","question":"Acute carbamazepine toxicity most resembles toxicity of which drugs?","options":[{"key":"A","text":"Barbiturates"},{"key":"B","text":"Anticholinergic drugs (e.g. TCA + atropine)"},{"key":"C","text":"Benzodiazepines"},{"key":"D","text":"Opiates"}],"answer":["B"],"type": ":"single","explanation":""},{"id":"q-229","origin":"new","subject":"Toxicology","topic":"Toxicology practical","question":"An X-ray shows dense metaphyseal “lead lines” in a child. Which metal is responsible?","options":[],"answer":"Lead.","type":"written","explanation":""},{"id":"q-230","origin":"new","subject":"Toxicology","topic":"Toxicology practical","question":"A blood gas shows pH 7.5, HCO− 3 34, normal CO2. What is the disturbance?","options":[],"answer":"Metabolic alkalosis.","type":"written","explanation":""},{"id":"q-231","origin":"new","subject":"Toxicology","topic":"Toxicology practical","question":"A picture shows diffuse skin hyperpigmentation with hyperkeratosis. Which poison?","options":[],"answer":"Arsenic.","type":"written","explanation":""},{"id":"q-232","origin":"new","subject":"Forensic Medicine","topic":"Medicolegal aspects of death","question":"Suspended animation is:","options":[{"key":"A","text":"Apparent death"},{"key":"B","text":"Somatic death"},{"key":"C","text":"Molecular death"},{"key":"D","text":"Clinical death"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-233","origin":"new","subject":"Forensic Medicine","topic":"Medicolegal aspects of death","question":"The medicolegal importance of molecular life is:","options":[{"key":"A","text":"Determination of the manner of death"},{"key":"B","text":"Diagnosis of brain stem death"},{"key":"C","text":"Sure sign of death"},{"key":"D","text":"Time for organ transplantation"}],"answer":["D"],"type":"single","explanation":""},{"id":"q-234","origin":"new","subject":"Forensic Medicine","topic":"Medicolegal aspects of death","question":"Molecular death:","options":[{"key":"A","text":"Occurs minutes to hours after somatic death"},{"key":"B","text":"Occurs minutes to hours before somatic death"},{"key":"C","text":"Occurs concurrently with somatic death"},{"key":"D","text":"No coincidence between it and somatic death"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-235","origin":"new","subject":"Forensic Medicine","topic":"Medicolegal aspects of death","question":"Irreversible cessation of respiration, circulation and CNS function is called:","options":[{"key":"A","text":"Biological death"},{"key":"B","text":"Clinical death"},{"key":"C","text":"Apparent death"},{"key":"D","text":"Brain stem death"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-236","origin":"new","subject":"Forensic Medicine","topic":"Medicolegal aspects of death","question":"Sudden death is:","options":[{"key":"A","text":"Death of a young man"},{"key":"B","text":"Death of an apparently normal subject"},{"key":"C","text":"Poisonous death"},{"key":"D","text":"Rapid death of a chronic patient"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-237","origin":"new","subject":"Forensic Medicine","topic":"Postmortem changes","question":"Rigor mortis first appears in:","options":[{"key":"A","text":"Eyelids"},{"key":"B","text":"Muscles of abdominal wall"},{"key":"C","text":"Muscles of hands"},{"key":"D","text":"Muscles of lower limbs"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-238","origin":"new","subject":"Forensic Medicine","topic":"Postmortem changes","question":"In which stage are muscles sensitive to electrical stimuli?","options":[{"key":"A","text":"Primary flaccidity"},{"key":"B","text":"Secondary flaccidity"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-239","origin":"new","subject":"Forensic Medicine","topic":"Postmortem changes","question":"Cadaveric spasm occurs due to:","options":[{"key":"A","text":"Chemical depletion of ATP"},{"key":"B","text":"Extreme nervous tension at the time of death"},{"key":"C","text":"Freezing of tissue fluids"},{"key":"D","text":"Heat coagulation of muscle proteins"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-240","origin":"new","subject":"Forensic Medicine","topic":"Postmortem changes","question":"Maceration is caused by:","options":[{"key":"A","text":"Aseptic tissue autol earance of hypostasis"},{"key":"B","text":"Drop of body temperature"},{"key":"C","text":"Manifestations of putrefaction"},{"key":"D","text":"Presence of rigor mortis"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-251","origin":"new","subject":"Forensic Medicine","topic":"Postmortem changes","question":"Arborisation due to hydrogen sulfide (H2S) accumulation in superficial veins is a postmortem change associated with:","options":[{"key":"A","text":"Rigor mortis"},{"key":"B","text":"Livor mortis"},{"key":"C","text":"Putrefaction"},{"key":"D","text":"Mummification"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-252","origin":"new","subject":"Forensic Medicine","topic":"Postmortem changes","question":"In algor mortis:","options":[{"key":"A","text":"Happens when rigor mortis ends"},{"key":"B","text":"Temperature decreases until it reaches the surroundings"},{"key":"C","text":"There is no change in temperature"},{"key":"D","text":"Happens when rigor mortis begins"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-253","origin":"new","subject":"Forensic Medicine","topic":"Postmortem changes","question":"Cooling does not affect:","options":[{"key":"A","text":"Rigor mortis"},{"key":"B","text":"Postmortem cooling"},{"key":"C","text":"Cadaveric spasm"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-254","origin":"new","subject":"Forensic Medicine","topic":"Postmortem changes","question":"Cooling of the body after death is known as:","options":[{"key":"A","text":"Rigor mortis"},{"key":"B","text":"Livor mortis"},{"key":"C","text":"Algor mortis"},{"key":"D","text":"Pallor mortis"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-255","origin":"new","subject":"Forensic Medicine","topic":"Postmortem changes","question":"What causes postmortem stiffness other than rigor mortis?","options":[],"answer":"Cadaveric spasm (also heat stiffening and freezing).","type":"written","explanation":""},{"id":"q-256","origin":"new","subjec ysis of the vital cardiac and respiratory centres; due to cerebral haemorrhage; due to head trauma; other contributing condition: hypertension.","type":"written","explanation":""},{"id":"q-260","origin":"new","subject":"Forensic Medicine","topic":"Death certificate and cause of death","question":"A 60-year-old man with atherosclerotic coronary heart disease and type 2 DM presented with severe stabbing chest pain, very high troponin and died. Write the death certificate.","options":[],"answer":"Immediate: cardiac dysfunction; due to myocardial infarction; due to coronary artery disease; other contributing condition: diabetes mellitus.","type":"written","explanation":""},{"id":"q-261","origin":"new","subject":"Forensic Medicine","topic":"Death certificate and cause of death","question":"A 30-year-old man had a fractured left femur after a car accident, was treated with plaster and discharged; a week later he developed pulmonary embolism and died. Write the death certificate.","options":[],"answer":"Immediate: right heart failure; due to pulmonary embolism; due to left femur fracture; no other contributing condition.","type":"written","explanation":""},{"id":"q-262","origin":"new","subject":"Forensic Medicine","topic":"Death certificate and cause of death","question":"A 73-year-old asthmatic was admitted with COVID-19, deteriorated, needed ventilation and died. Write the death certificate.","options":[],"answer":"Immediate: acute respiratory failure; due to viral pneumonia (COVID-19); other contributing condition: asthma.","type":"written","explanation":""},{"id":"q-263","origin":"new","subject":"Forensic Medicine","topic":"Death certificate and cause of death","question":"A 7-month-old infant with congenital cyanotic heart disease developed chest infection, septicaemia and multiorgan failure and died. Write the death certificate.","options":[],"answer":"Immediate: multisystem organ failure; due to septicaemia; due to acute pneumonia; other contributing condition: cong  Medicine","topic":"Asphyxia","question":"Which statement about smothering is incorrect?","options":[{"key":"A","text":"It is a type of asphyxia"},{"key":"B","text":"Obstruction to the internal air passage"},{"key":"C","text":"It involves blockage of nose and mouth"},{"key":"D","text":"It prevents air entry"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-395","origin":"new","subject":"Forensic Medicine","topic":"Asphyxia","question":"(SAQ) Give the definition of throttling and its external and internal sure signs.","options":[],"answer":"Definition: violent asphyxia due to occlusion of the airway by violent pressure on the neck, usually by hands, for at least 2 minutes. Internal: extravasation of blood in the subcutaneous tissues beneath the external bruises/abrasions (most significant). External: general signs of violent asphyxia with marked facial venous congestion (proptosis, subconjunctival haemorrhage, bloody discharge from mouth/nose) plus fingernail abrasions and contusions on the neck — which may be absent if gloves, a collar or a veil intervened.","type":"written","explanation":""},{"id":"q-396","origin":"new","subject":"Forensic Medicine","topic":"Sexual offences","question":"The following is NOT true regarding rape:","options":[{"key":"A","text":"Sexual relation between a male and a female"},{"key":"B","text":"Outside legal regulations"},{"key":"C","text":"The female must be a virgin"},{"key":"D","text":"Without the female consent"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-397","origin":"new","subject":"Forensic Medicine","topic":"Sexual offences","question":"Incest is:","options":[{"key":"A","text":"A sexual relation between a female and an animal"},{"key":"B","text":"A sexual relation between a male and a dead body"},{"key":"C","text":"A sexual relation between brother and sister"},{"key":"D","text":"The pleasure of exposing own genitalia"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-398","origin":"new","sub anticide, a woman with signs of remote delivery won’t be a suspect"},{"key":"C","text":"In inheritance cases it is not useful to examine a widow for signs of recent delivery"},{"key":"D","text":"Not useful in remote delivery cases"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-423","origin":"new","subject":"Forensic Medicine","topic":"Pregnancy, delivery and abortion","question":"All the following situations are criminal abortions EXCEPT:","options":[{"key":"A","text":"To save the mother’s life"},{"key":"B","text":"Upon request for fetal malformation"},{"key":"C","text":"Upon request not wanting more kids"},{"key":"D","text":"After rape"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-424","origin":"new","subject":"Forensic Medicine","topic":"Pregnancy, delivery and abortion","question":"The obstetrician who carries out a therapeutic abortion has to do all of the following EXCEPT:","options":[{"key":"A","text":"Consult a specialist to give his agreement"},{"key":"B","text":"Carry the operation in a licensed clinic"},{"key":"C","text":"Have a written consent of the woman"},{"key":"D","text":"Have a written consent of the husband"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-425","origin":"new","subject":"Forensic Medicine","topic":"Pregnancy, delivery and abortion","question":"A pregnant woman sentenced to death should be executed immediately:","options":[{"key":"A","text":"True"},{"key":"B","text":"False"},{"key":"C","text":"Depends on gestational age"},{"key":"D","text":"After court review"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-426","origin":"new","subject":"Forensic Medicine","topic":"Pregnancy, delivery and abortion","question":"Which of the following is TRUE regarding a pregnancy test?","options":[{"key":"A","text":"Positive results are only obtained in cases of pregnancy"},{"key":"B","text":"Depends on detection of estrogen"},{"key":"C","text":"False positive results may lead to homicidal crimes"},{  care"},{"key":"B","text":"Surgery"},{"key":"C","text":"Cosmetic care"},{"key":"D","text":"Isolation"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-1029","origin":"new","subject":"Family Medicine","topic":"Referral","question":"The family physician remains coordinator of healthcare even after referral. This is called:","options":[{"key":"A","text":"Fragmentation"},{"key":"B","text":"Holistic care"},{"key":"C","text":"Referral system"},{"key":"D","text":"Community diagnosis"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-1030","origin":"new","subject":"Family Medicine","topic":"Referral","question":"True or False: Referral means ending the relationship with the patient.","options":[{"key":"True","text":"True"},{"key":"False","text":"False"}],"answer":["False"],"type":"single","explanation":""},{"id":"q-1031","origin":"new","subject":"Family Medicine","topic":"Referral","question":"True or False: The family physician coordinates referrals.","options":[{"key":"True","text":"True"},{"key":"False","text":"False"}],"answer":["True"],"type":"single","explanation":""},{"id":"q-1032","origin":"new","subject":"Family Medicine","topic":"Evidence based medicine","question":"Decision-making based on evidence and prevalence in early undifferentiated disease refers to:","options":[{"key":"A","text":"Community orientation"},{"key":"B","text":"Holistic care"},{"key":"C","text":"Specific problem-solving skills"},{"key":"D","text":"Cost-effective care"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-1033","origin":"new","subject":"Family Medicine","topic":"Evidence based medicine","question":"A family physician is interested in conducting evidence-based health promotion activities at the level of the community. He decided to start with screening for hypertension among obese and diabetic patients. Which of the following best describes this activity?","options":[{"key":"A","text":"Health awareness campaign"},{"key":"B","text":"Primordial prevention derstand the delicate situation, but inform the patient of his diagnosis as it is his right to know"},{"key":"E","text":"Ask the family to break the diagnosis at an appropriate time"}],"answer":["D"],"type":"single","explanation":""},{"id":"q-1042","origin":"new","subject":"Family Medicine","topic":"Doctor patient relationship","question":"True or False: Person-centred care depends on a long-term doctor–patient relationship.","options":[{"key":"True","text":"True"},{"key":"False","text":"False"}],"answer":["True"],"type":"single","explanation":""},{"id":"q-1043","origin":"new","subject":"Family Medicine","topic":"Access to care","question":"Accessibility in primary care means:","options":[{"key":"A","text":"Difficult referral systems"},{"key":"B","text":"Easy entry to healthcare services"},{"key":"C","text":"Expensive consultations"},{"key":"D","text":"Specialist-only care"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-1044","origin":"new","subject":"Family Medicine","topic":"Access to care","question":"A clinic is located within a community and provides affordable care with easy appointment access. This represents:","options":[{"key":"A","text":"Accessibility"},{"key":"B","text":"Continuity"},{"key":"C","text":"Coordination"},{"key":"D","text":"Fragmentation"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-1045","origin":"new","subject":"Family Medicine","topic":"Access to care","question":"A patient enters a clinic without referral and is managed directly by the family physician. This is:","options":[{"key":"A","text":"Coordination"},{"key":"B","text":"First-contact care"},{"key":"C","text":"Continuity"},{"key":"D","text":"Comprehensiveness"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-1046","origin":"new","subject":"Family Medicine","topic":"Access to care","question":"A family physician manages asthma, diabetes, antenatal care and mental health patients in the same clinic. This is:","options":[{"key":"A","text":"Fragmentation"},{"key":"B","text":"Comprehensiveness + accessibility"},{"key":"C","text":"Specialist care"},{"key":"D","text":"Emergency care"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-1047","origin":"new","subject":"Family Medicine","topic":"Access to care","question":"“First contact and open access” are components of:","options":[{"key":"A","text":"Community orientation"},{"key":"B","text":"Primary care management"},{"key":"C","text":"Holistic care"},{"key":"D","text":"Referral system"}],"answer":["B"],"type":"single","explanation":""},{"id":"q-1048","origin":"new","subject":"Family Medicine","topic":"Access to care","question":"“Open access for all health problems” belongs to:","options":[{"key":"A","text":"Primary care management"},{"key":"B","text":"Holistic care"},{"key":"C","text":"Community orientation"},{"key":"D","text":"Referral system"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-1049","origin":"new","subject":"Family Medicine","topic":"Access to care","question":"A physician accepts patients with any complaint regardless of age or gender. This reflects:","options":[{"key":"A","text":"Open access"},{"key":"B","text":"Hospital care"},{"key":"C","text":"Specialised care"},{"key":"D","text":"Restrictive care"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-1050","origin":"new","subject":"Family Medicine","topic":"Access to care","question":"Select all that apply. Primary care management includes:","options":[{"key":"A","text":"First contact care"},{"key":"B","text":"Open access"},{"key":"C","text":"All health problems"},{"key":"D","text":"ICU management only"}],"answer":["A","B","C"],"type":"multi","explanation":""},{"id":"q-1051","origin":"new","subject":"Family Medicine","topic":"Access to care","question":"True or False: Primary care management includes first-contact care.","options":[{"key":"True","text":"True"},{"key":"False","text":"False"}],"answer":["True"],"type":"single","explanation":""},{"id":"q-1052","origin":"new","subject":"Family Medicine","topic":"Patient compliance","question":"Effective communication increases:","options":[{"key":"A","text":"Misunderstanding"},{"key":"B","text":"Patient dissatisfaction"},{"key":"C","text":"Patient compliance with treatment"},{"key":"D","text":"Medical errors only"}],"answer":["C"],"type":"single","explanation":""},{"id":"q-1053","origin":"new","subject":"Family Medicine","topic":"Patient compliance","question":"A patient expects antibiotics for a viral infection. The doctor explores expectations, explains the illness, and agrees on symptomatic treatment. This is:","options":[{"key":"A","text":"ICE + shared decision-making"},{"key":"B","text":"Blind prescribing"},{"key":"C","text":"Emergency referral"},{"key":"D","text":"Surgical management"}],"answer":["A"],"type":"single","explanation":""},{"id":"q-1054","origin":"new","subject":"Family Medicine","topic":"Patient compliance","question":"True or False: A good doctor–patient relationship improves compliance.","options":[{"key":"True","text":"True"},{"key":"False","text":"False"}],"answer":["True"],"type":"single","explanation":""},{"id":"q-1055","origin":"old","subject":"Toxicology","topic":"Sedatives and hypnotics (Barbiturates & Benzodiazepines)","question":"One of the following is true as regards Flumazenil:","options":[{"key":"A","text":"It is indicated in treatment of acute benzodiazepine toxicity"},{"key":"B","text":"It is indicated in combined toxicity of benzodiazepines & tricyclic antidepressants"},{"key":"C","text":"Its antagonistic effect lasts for 10 hours"},{"key":"D","text":"None of the above"}],"answer":["A"],"type":"single","explanation":"Flumazenil is a benzodiazepine-receptor antagonist used in selected acute benzodiazepine toxicity. It is avoided in mixed TCA overdose because it may precipitate seizures, and its action is relatively short."},{"id":"q-1056","origin":"old","subject":"Toxicology","topic":"Psychotropics (TCA & Lithium)","question":"Regarding the effect of tricyclic antidepressants, they cause:","options":[{"key":"A","text":"Myosis"},{"key":"B","text":"Diarrhea"},{"key":"C","text":"Urine retention"},{"key":"D","text":"CNS depression followed by stimulation"}],"answer":["C"],"type":"single","explanation":"Tricyclic antidepressants have antimuscarinic effects, so urinary retention is expected; mydriasis and reduced gut motility are more typical than myosis or diarrhea."},{"id":"q-1057","origin":"old","subject":"Forensic Medicine","topic":"Wounds","question":"Fracture nasal bone is considered leaving a degree of permanent infirmity ONLY in case of:","options":[{"key":"A","text":"Combined with soft tissue injuries"},{"key":"B","text":"Leaving a cosmetic disfigurement"},{"key":"C","text":"Combined with anosmia"},{"key":"D","text":"Leaving either a cosmetic or a functional disability or both"}],"answer":["D"],"type":"single","explanation":"A nasal fracture constitutes permanent infirmity when it leaves a persistent cosmetic deformity, functional impairment, or both."},{"id":"q-1058","origin":"old","subject":"Forensic Medicine","topic":"Head injuries","question":"Rupture of the bridging veins following head trauma leads to which type of cranial hemorrhage?","options":[{"key":"A","text":"Extradural hematoma"},{"key":"B","text":"Subdural hematoma"},{"key":"C","text":"Subarachnoid hematoma"},{"key":"D","text":"Intracerebral hematoma"}],"answer":["B"],"type":"single","explanation":"Bridging veins traverse the subdural space; tearing them classically produces a subdural hematoma."},{"id":"q-1059","origin":"old","subject":"Toxicology","topic":"Sedatives and hypnotics (Barbiturates & Benzodiazepines)","question":"Regarding benzodiazepines, one of the following is correct:","options":[{"key":"A","text":"They prolong GABA activity"},{"key":"B","text":"They potentiate GABA activity"},{"key":"C","text":"They have a higher toxicity than barbiturates"},{"key":"D","text":"They cause hypotension by stimulating the vasomotor center"}],"answer":["B"],"type":"single","explanation":"Benzodiazepines enhance GABA-A receptor activity and are generally safer than barbiturates in isolated overdose."},{"id":"q-1060","origin":"old","subject":"Toxicology","topic":"Psychotropics (TCA & Lithium)","question":"Tricyclic antidepressants cause hypotension mainly through:","options":[{"key":"A","text":"Indirect myocardial depression"},{"key":"B","text":"Inhibition of the vasomotor center"},{"key":"C","text":"Peripheral vasodilation"},{"key":"D","text":"Decreasing the cardiac output"}],"answer":["C"],"type":"single","explanation":"Alpha-1 adrenergic blockade causes peripheral vasodilation and contributes importantly to hypotension in TCA toxicity."},{"id":"q-1061","origin":"old","subject":"Forensic Medicine","topic":"Head injuries","question":"Which feature is associated with depressed skull fracture?","options":[{"key":"A","text":"It is caused by a strike with a heavy sharp instrument"},{"key":"B","text":"The most depressed part of the fracture indicates the position of the assailant"},{"key":"C","text":"The shape of the fracture is not indicative of the causative instrument"},{"key":"D","text":"Hinge fracture is a modified type of depressed skull fractures"}],"answer":["B"],"type":"single","explanation":"According to the uploaded model answer, the most depressed part helps indicate the assailant's position or direction of impact."},{"id":"q-1062","origin":"old","subject":"Toxicology","topic":"Sedatives and hypnotics (Barbiturates & Benzodiazepines)","question":"Which statement is TRUE as regards Flumazenil?","options":[{"key":"A","text":"It is indicated in chronic benzodiazepine toxicity"},{"key":"B","text":"It is contraindicated in combined benzodiazepine and tricyclic antidepressant toxicity"},{"key":"C","text":"Its antagonistic effect lasts for 10 hours"},{"key":"D","text":"None of the above"}],"answer":["B"],"type":"single","explanation":"Flumazenil may trigger seizures in mixed benzodiazepine–TCA overdose, so it is contraindicated in that setting."},{"id":"q-1063","origin":"old","subject":"Forensic Medicine","topic":"Head injuries","question":"Which statement is TRUE about the lucid interval?","options":[{"key":"A","text":"It is the interval after concussion before progression into compression"},{"key":"B","text":"It occurs after compression before concussion"},{"key":"C","text":"During it the patient is unconscious"},{"key":"D","text":"It occurs only with massive intracranial hematoma"}],"answer":["A"],"type":"single","explanation":"A lucid interval is temporary recovery of consciousness after concussion before deterioration from expanding intracranial compression."},{"id":"q-1064","origin":"old","subject":"Forensic Medicine","topic":"Physical and thermal injuries","question":"Wallace classification for the extent of burns depends on:","options":[{"key":"A","text":"Depth of tissue affected"},{"key":"B","text":"Individual susceptibility"},{"key":"C","text":"Percentage of body surface area affected"},{"key":"D","text":"Surgical assessment"}],"answer":["C"],"type":"single","explanation":"The Wallace rule of nines estimates the percentage of total body surface area burned."},{"id":"q-1065","origin":"old","subject":"Forensic Medicine","topic":"Head injuries","question":"The following are characteristics of skull fissure fracture EXCEPT:","options":[{"key":"A","text":"Starts at the point of impact"},{"key":"B","text":"May be single or branched"},{"key":"C","text":"Characterized by loss of substance"},{"key":"D","text":"May occur at the base of the skull"}],"answer":["C"],"type":"single","explanation":"A fissure fracture is a linear crack and is not characterized by loss of bony substance."},{"id":"q-1066","origin":"old","subject":"Forensic Medicine","topic":"Physical and thermal injuries","question":"Healing with thin scarring and least disfigurement is commonly seen in:","options":[{"key":"A","text":"Dry burns"},{"key":"B","text":"Electric burns"},{"key":"C","text":"Radiation burns"},{"key":"D","text":"Scalds"}],"answer":["D"],"type":"single","explanation":"Scalds commonly affect the skin more uniformly and, when superficial, tend to heal with thinner scars and less disfigurement."},{"id":"q-1067","origin":"old","subject":"Forensic Medicine","topic":"Head injuries","question":"The injury marked in the original picture is considered as:","options":[{"key":"A","text":"Coup injury"},{"key":"B","text":"Counter-coup injury"},{"key":"C","text":"Depressed skull fracture"},{"key":"D","text":"Subdural abscess"}],"answer":["B"],"type":"single","explanation":"The uploaded answer key gives counter-coup injury, but the original image is missing from the supplied text, so this item should be reviewed with the image."},{"id":"q-1068","origin":"old","subject":"Forensic Medicine","topic":"Physical and thermal injuries","question":"Melting and magnetization of metals characterizes:","options":[{"key":"A","text":"Cardioversion"},{"key":"B","text":"Dry burns"},{"key":"C","text":"Electrocution"},{"key":"D","text":"Lightning"}],"answer":["D"],"type":"single","explanation":"Lightning delivers a very high-energy discharge that may melt or magnetize nearby metallic objects."},{"id":"q-1069","origin":"old","subject":"Toxicology","topic":"Psychotropics (TCA & Lithium)","question":"The following is used effectively for elimination of tricyclic antidepressants:","options":[{"key":"A","text":"Diuresis"},{"key":"B","text":"Dialysis"},{"key":"C","text":"Multiple-dose activated charcoal"},{"key":"D","text":"Hemoperfusion"}],"answer":["C"],"type":"single","explanation":"The uploaded model answer selects multiple-dose activated charcoal. This answer is retained exactly as supplied."},{"id":"q-1070","origin":"old","subject":"Forensic Medicine","topic":"Head injuries","question":"Detection of blood cells in cerebrospinal fluid is characteristic of:","options":[{"key":"A","text":"Contused wound of the scalp"},{"key":"B","text":"Extradural hemorrhage"},{"key":"C","text":"Subdural hematoma"},{"key":"D","text":"Subarachnoid hemorrhage"}],"answer":["D"],"type":"single","explanation":"Blood enters the cerebrospinal fluid when bleeding occurs in the subarachnoid space."},{"id":"q-1071","origin":"old","subject":"Forensic Medicine","topic":"Physical and thermal injuries","question":"Death due to electric current may be attributed to all of the following EXCEPT:","options":[{"key":"A","text":"Depression of the respiratory center"},{"key":"B","text":"Paralysis of respiratory muscles and diaphragm"},{"key":"C","text":"Ventricular fibrillation"},{"key":"D","text":"Severe destruction of the affected tissues"}],"answer":["D"],"type":"single","explanation":"Immediate electrical death is usually due to ventricular fibrillation, respiratory-center depression, or respiratory muscle tetany rather than local tissue destruction alone."},{"id":"q-1072","origin":"old","subject":"Toxicology","topic":"Psychotropics (TCA & Lithium)","question":"Regarding lithium toxicity, which statement is INCORRECT?","options":[{"key":"A","text":"Mild toxicity causes ataxia"},{"key":"B","text":"Severe toxicity causes convulsions"},{"key":"C","text":"ECG changes include T-wave inversion"},{"key":"D","text":"Hemodialysis is done only once if indicated"}],"answer":["D"],"type":"single","explanation":"Lithium can redistribute from tissues after dialysis, so repeated sessions may be needed; a single session is not always sufficient."},{"id":"q-1073","origin":"old","subject":"Forensic Medicine","topic":"Physical and thermal injuries","question":"Which is a delayed cause of death from burns after one week?","options":[{"key":"A","text":"Acute edema of the glottis"},{"key":"B","text":"Carbon-monoxide asphyxiation"},{"key":"C","text":"Hepato-renal failure"},{"key":"D","text":"Primary neurogenic shock"}],"answer":["C"],"type":"single","explanation":"Hepatic and renal failure are delayed systemic complications, whereas glottic edema, CO toxicity, and neurogenic shock are early causes."},{"id":"q-1074","origin":"old","subject":"Toxicology","topic":"Sedatives and hypnotics (Barbiturates & Benzodiazepines)","question":"Regarding benzodiazepines, which of the following is CORRECT?","options":[{"key":"A","text":"They prolong GABA activity"},{"key":"B","text":"They potentiate GABA activity"},{"key":"C","text":"They have higher toxicity than barbiturates"},{"key":"D","text":"Flumazenil does not cause convulsions with TCA co-ingestion"}],"answer":["B"],"type":"single","explanation":"Benzodiazepines potentiate GABA-A–mediated inhibition. Flumazenil can provoke seizures in mixed TCA ingestion."},{"id":"q-1075","origin":"old","subject":"Forensic Medicine","topic":"Physical and thermal injuries","question":"A burned body showed boxer position, a skull fissure fracture, and carboxyhemoglobin of 40%. Which finding proves antemortem burning?","options":[{"key":"A","text":"Boxer position"},{"key":"B","text":"Percentage of burn"},{"key":"C","text":"Blood carboxyhemoglobin"},{"key":"D","text":"Skull fissure fracture"}],"answer":["C"],"type":"single","explanation":"A raised blood carboxyhemoglobin level indicates inhalation of carbon monoxide while circulation and breathing were still present."},{"id":"q-1076","origin":"old","subject":"Forensic Medicine","topic":"Physical and thermal injuries","question":"Tree-branch-like burn marks on the trunk most strongly suggest death due to:","options":[{"key":"A","text":"Chemical burn"},{"key":"B","text":"Corrosive injury"},{"key":"C","text":"Exposure to severe cold"},{"key":"D","text":"Lightning"}],"answer":["D"],"type":"single","explanation":"Branching Lichtenberg figures are characteristic skin markings associated with lightning."},{"id":"q-1077","origin":"old","subject":"Toxicology","topic":"Sedatives and hypnotics (Barbiturates & Benzodiazepines)","question":"Which statement is true about benzodiazepines?","options":[{"key":"A","text":"They stimulate dopaminergic receptors"},{"key":"B","text":"Dependence is not a se
